<style>
/* Layout: a night-mode adventure game. A fixed HUD holds the stats row and a
   large bay where the ship sails Maksim's career on its own and trades
   cannon fire with pirates. Below it the résumé scrolls as chapters; what you
   collect there (gold, XP) decides whether the ship wins its battles. */
:root{
  color-scheme: dark;
  --void:#0A0E1A;      /* page ground */
  --deep:#111729;
  --panel:#182035;     /* cards */
  --panel-2:#141B2E;
  --line:#2A3450;
  --ink:#F1E9DB;       /* warm cream */
  --ink-dim:#B6BDD1;
  --muted:#7B84A1;
  --ember:#E8552F;     /* the one accent */
  --ember-lit:#FF7C4E;
  --gold:#E3A93C;
  --moon:#CCDCF7;
  --plaque:#F3ECDF;    /* light ground for company logos */
  --hp-ship:#63C08C;   /* semantic: own hull */

  --r-common:#7B84A1; --r-rare:#5B92DB; --r-epic:#9C7CD8; --r-legendary:#E3A93C;

  --display:"Cinzel","Forum","Iowan Old Style",Georgia,serif;
  --mono:"Space Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:"Spectral","Iowan Old Style",Georgia,serif;

  --top-h:44px;
  --sea-h:172px;
  --hud-h:217px;       /* replaced at runtime with the measured HUD height */
}
@media (max-width:900px){ :root{ --sea-h:152px } }
@media (max-width:620px){ :root{ --sea-h:124px } }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0; background:var(--void); color:var(--ink-dim); font-family:var(--body); font-size:16px; line-height:1.66; -webkit-font-smoothing:antialiased; overflow-x:hidden}

/* ── HUD: stats row ─────────────────────────────────────── */
.hud{position:fixed; inset:0 0 auto 0; z-index:60; padding-top:env(safe-area-inset-top,0px); background:rgba(10,14,26,.94); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.hud-top{display:flex; align-items:center; gap:12px; height:var(--top-h); padding-inline:14px}
.hud-rank{display:flex; align-items:center; gap:9px; min-width:0}
.hud-lv{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--void); background:var(--ember); padding:4px 8px; border-radius:2px; white-space:nowrap}
.hud-rank-name{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud-bar{flex:1 1 auto; min-width:56px}
.bar-track{display:block; height:6px; background:#1E2740; border:1px solid var(--line); border-radius:99px; overflow:hidden}
.bar-fill{display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--ember),var(--ember-lit)); transition:width .55s cubic-bezier(.2,.8,.2,1)}
.hud-xp{display:block; margin-top:2px; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.hud-stat{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink)}
.hud-stat svg{width:13px; height:13px; flex:none}
.hud-stat small{font-size:9px; letter-spacing:.12em; color:var(--muted); font-weight:400}
.hud-gold{color:var(--gold)}
.pulse{animation:pulse .45s ease-out}
@keyframes pulse{40%{transform:scale(1.25)}}
.hud-btn{display:grid; place-items:center; width:30px; height:28px; padding:0; font-family:var(--mono); font-size:13px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:3px; cursor:pointer; transition:color .15s,border-color .15s}
.hud-btn svg{width:15px; height:15px}
.hud-btn:hover{color:var(--ink); border-color:var(--ember)}
.hud-btn[aria-pressed="true"]{color:var(--ember); border-color:var(--ember)}
#btnSound .slash{display:inline}
#btnSound[aria-pressed="true"] .slash{display:none}
.hud-btn:focus-visible,button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ember-lit); outline-offset:2px}
@media (max-width:760px){ .hud-stat small{display:none} .hud-stat.cmb{gap:3px; font-size:11px} }
@media (max-width:620px){ .hud-rank-name{display:none} .hud-top{gap:7px; padding-inline:10px} .hud-bar{min-width:36px} .hud-btn{width:27px} .hud-xp{font-size:8px} }

/* ── static coin (HUD, legend) ──────────────────────────── */
.coin{width:13px; height:13px; border-radius:50%; flex:none; display:inline-block;
  background:radial-gradient(circle at 32% 28%,rgba(255,250,220,.95) 0 9%,rgba(255,250,220,0) 30%),
             radial-gradient(circle,#F2C14E 0 50%,#C98A17 51% 58%,#F7D27A 59% 66%,#A86A12 67%);
  box-shadow:inset 0 0 0 1px #8F5A0C, 0 1px 0 rgba(0,0,0,.4)}

/* ── HUD: the bay — one canvas scene; pills float over it on wide screens ── */
.sea{position:relative; height:var(--sea-h); overflow:hidden; border-top:1px solid var(--line); background:#123A6E}
.bay-cv{position:absolute; inset:0; width:100%; height:100%; display:block}
.sea-pill{position:absolute; top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 8px); z-index:8; font-family:var(--mono); letter-spacing:.1em; padding:7px 10px 6px; border-radius:4px; background:rgba(6,10,22,.6); border:1px solid rgba(255,255,255,.07); pointer-events:none}
.sea-status{left:10px; width:min(46%,360px)}
.st-t{display:flex; justify-content:space-between; gap:10px; font-size:9.5px; text-transform:uppercase; color:var(--ink); white-space:nowrap}
.st-t b{color:var(--gold); font-weight:700}
.fp{display:block; height:5px; margin:5px 0; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden}
.fp i{display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,#C8891A,#FFD27A); box-shadow:0 0 10px rgba(255,200,90,.7); transition:width .7s cubic-bezier(.2,.8,.2,1)}
.st-d{display:block; font-size:9.5px; color:var(--ink-dim); letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sea-info{right:10px; font-size:9.5px; text-transform:uppercase; color:var(--ink-dim); white-space:nowrap}
.sea-info b{color:var(--gold); font-weight:700}
@media (max-width:620px){
  .sea-info{display:none}
  .sea-status{position:static; width:auto; border:0; border-radius:0; border-top:1px solid var(--line); background:#0B1224; padding:6px 12px 7px}
  .fp{margin:4px 0}
  .st-d{font-size:9px}
}

/* ── page frame ─────────────────────────────────────────── */
main{max-width:1060px; margin:0 auto; padding-inline:18px; padding-block:calc(var(--hud-h) + 14px) 80px}
section{padding-block:56px 0; scroll-margin-top:calc(var(--hud-h) + 14px)}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--ember); margin:0 0 10px; display:flex; align-items:center; gap:10px}
.eyebrow::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}
h2{font-family:var(--display); font-weight:700; font-size:clamp(25px,4.4vw,38px); color:var(--ink); letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; line-height:1.14; text-wrap:balance}
h3{font-family:var(--display); font-weight:700; font-size:19px; color:var(--ink); letter-spacing:.04em; margin:0}
.sub{font-size:15px; color:var(--muted); margin:0 0 26px; max-width:62ch; font-style:italic}
p{margin:0 0 14px; max-width:66ch}
b,strong{color:var(--ink); font-weight:600}
a{color:var(--ember-lit)}

/* glowing, tappable phrases: liquid gold with a slow sheen and a little star */
.glow{position:relative; font-weight:600; cursor:pointer; border-radius:3px; color:#FFD27A;
  text-shadow:0 0 8px rgba(255,196,84,.55),0 0 18px rgba(227,169,60,.3);
  box-shadow:inset 0 -1.5px 0 rgba(255,210,122,.55),0 7px 14px -9px rgba(255,190,80,.7);
  transition:filter .2s,box-shadow .2s}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .glow:not(.spent){
    background-image:linear-gradient(100deg,#D99A2B 0%,#FFD27A 28%,#FFF7DE 44%,#FFD27A 60%,#D99A2B 100%);
    background-size:240% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent; text-shadow:none;
    filter:drop-shadow(0 0 5px rgba(255,190,80,.6));
    animation:sheen 3.4s linear infinite}
}
.glow:not(.spent)::after{content:"✦"; display:inline-block; margin-left:3px; font-size:.62em; vertical-align:.55em; color:#FFE6A0; -webkit-text-fill-color:#FFE6A0; text-shadow:0 0 6px rgba(255,220,140,.95); animation:twink 2.2s ease-in-out infinite}
.glow:not(.spent):hover{filter:drop-shadow(0 0 9px rgba(255,205,100,.95)) brightness(1.12); box-shadow:inset 0 -2px 0 rgba(255,220,140,.9),0 8px 18px -8px rgba(255,200,90,.9)}
.glow.spent{color:var(--ink); background:none; text-shadow:none; box-shadow:none; filter:none; cursor:default; -webkit-text-fill-color:currentColor}
.glow.demo{cursor:default; pointer-events:none}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes twink{0%,100%{opacity:.35; transform:scale(.75) rotate(0)}50%{opacity:1; transform:scale(1.15) rotate(20deg)}}

/* ── 3D coins: two embossed faces and a stacked milled edge ── */
.coin3d{position:absolute; z-index:4; width:30px; height:30px; padding:0; border:0; background:none; cursor:pointer; perspective:220px; animation:coinfloat 2.6s ease-in-out infinite}
.coin3d.big{width:38px; height:38px}
.coin3d.inline{position:relative; display:inline-block; vertical-align:middle; margin-left:10px}
.coin3d::before{content:""; position:absolute; inset:-55%; border-radius:50%; background:radial-gradient(circle,rgba(227,169,60,.32),rgba(227,169,60,0) 62%); pointer-events:none}
.coin3d::after{content:""; position:absolute; right:-3px; top:-3px; width:10px; height:10px; pointer-events:none;
  background:radial-gradient(circle,#fff 0 12%,rgba(255,255,255,0) 32%),linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0)) center/100% 1.5px no-repeat,linear-gradient(rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0)) center/1.5px 100% no-repeat;
  opacity:0; animation:glint 3.4s ease-in-out infinite}
.c3{position:absolute; inset:0; transform-style:preserve-3d; animation:c3spin 3s linear infinite}
.c3-face{position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center;
  background:radial-gradient(circle at 30% 26%,rgba(255,252,228,.95) 0 7%,rgba(255,252,228,0) 30%),
             radial-gradient(circle,#F4C653 0 49%,#C8891A 50% 56%,#F9D886 57% 63%,#B97C13 64% 100%);
  box-shadow:inset 0 0 0 1.5px #8F5A0C,inset 0 -3px 4px rgba(110,62,0,.5),inset 0 2px 3px rgba(255,242,196,.75)}
.c3-front{transform:translateZ(var(--t,2px))}
.c3-back{transform:rotateY(180deg) translateZ(var(--t,2px))}
.c3-mark{font-family:var(--display); font-weight:700; font-size:13px; line-height:1; color:#A8700F; text-shadow:0 1px 0 rgba(255,240,190,.85),0 -1px 0 rgba(100,55,0,.55)}
.coin3d.big .c3-mark{font-size:17px}
.c3-edge{position:absolute; inset:0; border-radius:50%; transform:translateZ(var(--z)); background:radial-gradient(circle,#9A620F 0 60%,#7A4A08 100%); box-shadow:inset 0 0 0 1px #6A3F06}
.c3-band{position:absolute; left:50%; top:3%; height:94%; width:var(--th,4px); margin-left:calc(var(--th,4px) / -2); transform:rotateY(90deg); border-radius:2px;
  background:repeating-linear-gradient(180deg,#E0A53A 0 1.5px,#9A620F 1.5px 3px),linear-gradient(90deg,#7A4A08,#C8891A 50%,#7A4A08); background-blend-mode:multiply}
.c3-shadow{position:absolute; left:20%; right:20%; bottom:-9px; height:5px; border-radius:50%; background:radial-gradient(ellipse,rgba(0,0,0,.55),rgba(0,0,0,0) 70%); animation:shadow 2.6s ease-in-out infinite}
.coin3d:hover .c3{animation-duration:.9s}
.coin3d.taken .c3{animation:c3spin .35s linear infinite}
.coin3d.taken{animation:none; transform:scale(1.35); transition:transform .18s}
@keyframes c3spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes coinfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1); opacity:.9}50%{transform:scaleX(.7); opacity:.5}}
@keyframes glint{0%,70%,100%{opacity:0; transform:scale(.3)}82%{opacity:.95; transform:scale(1)}}
.coin-fly{position:fixed; z-index:75; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 30% 26%,rgba(255,252,228,.95) 0 7%,rgba(255,252,228,0) 30%),radial-gradient(circle,#F4C653 0 49%,#C8891A 50% 56%,#F9D886 57% 63%,#B97C13 64% 100%);
  box-shadow:inset 0 0 0 1.5px #8F5A0C,0 0 14px rgba(227,169,60,.6)}
.floater{position:absolute; z-index:55; pointer-events:none; white-space:nowrap; font-family:var(--mono); font-size:11px; font-weight:700; color:var(--gold); text-shadow:0 1px 0 #000; transform:translate(-50%,-100%); animation:floatup 1.15s ease-out forwards}
.floater.xp{color:#FFE6A0}
@keyframes floatup{0%{opacity:0; transform:translate(-50%,-60%)}15%{opacity:1}100%{opacity:0; transform:translate(-50%,-260%)}}

/* ── hero ───────────────────────────────────────────────── */
.hero{position:relative; margin-top:6px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--deep)}
.scene{position:relative; width:100%; aspect-ratio:16/8; min-height:320px; max-width:100%; display:block}
.scene > svg{position:absolute; inset:0; width:100%; height:100%}

.hero-copy{position:absolute; inset:auto 0 0 0; padding:26px 24px 24px; text-align:center; background:linear-gradient(to top,rgba(10,14,26,.94) 35%,transparent)}
.hero-name{font-family:var(--display); font-weight:700; color:var(--ink); font-size:clamp(28px,6.4vw,54px); letter-spacing:.12em; margin:0; line-height:1.05; text-wrap:balance}
.hero-class{font-family:var(--mono); font-size:clamp(8.5px,1.7vw,11px); letter-spacing:.3em; text-transform:uppercase; color:var(--ember); margin:10px 0 0}
.hero-start{margin-top:18px; font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; background:var(--ember); color:#120A06; border:0; border-radius:3px; padding:11px 22px; cursor:pointer; font-weight:700; transition:transform .15s,background .15s}
.hero-start:hover{background:var(--ember-lit); transform:translateY(-1px)}
.hero-start[disabled]{background:transparent; color:var(--muted); border:1px solid var(--line); cursor:default; transform:none}
.hero-start,.hero-start:hover{color:#2B1700; padding:13px 26px; font-size:11.5px;
  background:linear-gradient(100deg,#C98A22 0%,#FFD27A 28%,#FFF6DA 44%,#FFD27A 60%,#C98A22 100%);
  background-size:240% 100%; animation:sheen 3.4s linear infinite; text-shadow:0 1px 0 rgba(255,244,214,.6);
  box-shadow:inset 0 0 0 1px rgba(255,236,180,.55),0 0 18px rgba(255,190,80,.55),0 8px 22px -6px rgba(255,176,60,.8)}
.hero-start::after{content:"✦"; margin-left:8px; font-size:.95em; color:#6B3E00; display:inline-block; animation:twink 2.2s ease-in-out infinite}
.hero-start:hover{filter:brightness(1.08); transform:translateY(-1px); box-shadow:inset 0 0 0 1px rgba(255,240,200,.8),0 0 26px rgba(255,200,90,.8),0 10px 26px -6px rgba(255,180,60,.95)}
.hero-start[disabled]{background:transparent; animation:none; filter:none; text-shadow:none; box-shadow:none; border:1px solid rgba(227,169,60,.4); color:var(--gold); transform:none}
.hero-start[disabled]::after{content:none}
@media (prefers-reduced-motion: reduce){ .hero-start,.hero-start::after{animation:none} }
.hero-class{max-width:none}
@media (max-width:640px){
  .scene{aspect-ratio:auto; height:clamp(300px,96vw,390px); min-height:0}
  .hero-copy{padding:18px 16px 18px; background:linear-gradient(to top,rgba(10,14,26,.95) 45%,rgba(10,14,26,.6) 75%,transparent)}
  .hero-name{font-size:clamp(25px,7.6vw,40px); letter-spacing:.08em}
  .hero-class{letter-spacing:.22em; margin-top:8px}
  .hero-start{margin-top:14px}
}
.moon-hit{cursor:pointer}
@keyframes sweep{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.beam{transform-box:view-box; transform-origin:838px 196px; animation:sweep 7s ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}

/* ── how to play ────────────────────────────────────────── */
.orders{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; margin-top:14px; background:var(--line); border:1px solid var(--line); border-radius:5px; overflow:hidden}
.order{background:var(--panel); padding:10px 13px; display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.35; color:var(--ink-dim)}
.order-ic{flex:none; width:32px; height:24px; display:grid; place-items:center}
.order-ic svg{height:20px; width:auto}
.order b{display:block; margin-bottom:1px; font-family:var(--mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink)}
.order b.glow{display:inline-block}
.spark-ic{font-size:17px; color:#FFD27A; text-shadow:0 0 8px rgba(255,200,90,.9)}
.hud-lv.sm{font-size:9px; padding:3px 5px}
@media (max-width:860px){ .orders{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:400px){ .order{padding:9px 10px; gap:8px; font-size:12px} .order-ic{width:26px} }

/* ── cards ──────────────────────────────────────────────── */
.card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:18px 20px}
.grid{display:grid; gap:14px}
.rel{position:relative}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:1 / -1}
@media (max-width:620px){ .g2{grid-template-columns:1fr} }

.plaque{display:grid; place-items:center; background:var(--plaque); border-radius:4px; padding:7px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 0 rgba(0,0,0,.35)}
.plaque img{max-width:100%; max-height:100%; object-fit:contain; display:block}

/* journal */
.journal{display:grid; grid-template-columns:132px minmax(0,1fr); gap:22px; align-items:start; background:linear-gradient(180deg,rgba(232,85,47,.05),transparent 42%),var(--panel); border-left:3px solid var(--ember)}
.portrait{width:132px; height:132px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ember),0 10px 30px rgba(0,0,0,.45); background:#2A3450}
.portrait img{width:100%; height:100%; object-fit:cover; display:block}
.journal p{font-size:17px; line-height:1.72}
.journal p:last-child{margin-bottom:0}
.journal .who-line{font-family:var(--mono); font-size:10.5px; line-height:1.5; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
@media (max-width:620px){ .journal{grid-template-columns:1fr} .portrait{width:104px; height:104px} }
.secret{color:var(--ink); border-bottom:1px dotted var(--muted); cursor:help; transition:color .2s,text-shadow .2s}
.secret:hover{color:var(--gold); text-shadow:0 0 12px rgba(227,169,60,.5)}
.secret.found{color:var(--gold); border-bottom-color:var(--gold); cursor:default}

.pin-dot{width:30px; height:30px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); background:var(--ember); border:2px solid #14192A; display:grid; place-items:center; box-shadow:0 0 0 3px rgba(232,85,47,.16); transition:background .2s}

.ach{display:flex; gap:12px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:14px 15px; opacity:.5; transition:opacity .3s,border-color .3s}

.contacts{display:none; margin-top:20px}
.contacts.open{display:block}

.toasts{position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:70; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none}

.banner{position:fixed; left:50%; top:56%; transform:translate(-50%,-50%) scale(.9); z-index:80; background:rgba(12,17,30,.97); border:1px solid var(--gold); border-radius:6px; padding:24px 34px; text-align:center; opacity:0; pointer-events:none; transition:opacity .3s,transform .3s; box-shadow:0 0 60px rgba(227,169,60,.2); max-width:88vw}

}

.lang{display:flex; flex:none; height:28px; border:1px solid var(--line); border-radius:3px; overflow:hidden}

  background:radial-gradient(circle,#FFFFFF 0,#FFF1C2 35%,rgba(255,226,150,0) 72%); box-shadow:0 0 14px 5px rgba(255,236,190,.75)}

  S.xp = o.xp|0; S.gold = o.gold|0; S.done = o.done || {}; S.sfx = o.sfx !== false; S.tier = o.tier|0;
  S.sailing = !!o.sailing; S.sunk = o.sunk|0; S.tents = o.tents|0;
  S.lang = (o.lang === "ru" || o.lang === "en") ? o.lang : "";
}

/* ═════════════════════════ SOUND (interface only, the battle is silent) ═════════════════════════ */
var actx = null;
function tone(freq, dur, type, vol){
  if(!S.sfx) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    var o = actx.createOscillator(), g = actx.createGain(), tt = actx.currentTime;
    o.type = type || "triangle"; o.frequency.setValueAtTime(freq, tt);
    g.gain.setValueAtTime(vol || .05, tt); g.gain.exponentialRampToValueAtTime(.0001, tt + dur);
    o.connect(g); g.connect(actx.destination); o.start(tt); o.stop(tt + dur);
  }catch(e){}
}
function sfxXp(){ tone(660,.12,"triangle",.04); }
function sfxGold(){ tone(880,.09,"square",.026); setTimeout(function(){ tone(1320,.12,"square",.022); },70); }
function sfxLevel(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,.22,"triangle",.045); }, i*110); }); }

function rankIndex(xp){ var i=0; for(var k=0;k<RANKS.length;k++){ if(xp >= RANKS[k].at) i=k; } return i; }
function tierIndex(g){ var tt=0; for(var k=0;k<TIERS.length;k++){ if(g >= TIERS[k].at) tt=k; } return tt; }
function level(){ return rankIndex(S.xp) + 1; }

function paintHud(){

  else{ var lo = r.at, hi = RANKS[i+1].at; $("hudBar").style.width = Math.max(2, Math.round((S.xp-lo)/(hi-lo)*100)) + "%"; $("hudXp").textContent = S.xp + " / " + hi + " XP"; }
  $("footProgress").textContent = t("explored", Math.round(progress()*100));
}

function toast(html, kind){
  var box = $("toasts"), el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : ""); el.innerHTML = html; box.appendChild(el);
  setTimeout(function(){ el.style.transition = "opacity .4s, transform .4s"; el.style.opacity = "0"; el.style.transform = "translateY(-6px)";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 420); }, 2600);
  while(box.children.length > 4) box.removeChild(box.firstChild);
}
var bannerQ = [], bannerOn = false;
function banner(k, n, s, snd){ bannerQ.push([k,n,s,snd]); if(!bannerOn) nextBanner(); }
function nextBanner(){
  var b = bannerQ.shift(); if(!b){ bannerOn = false; return; }
  bannerOn = true; $("bnK").textContent = b[0]; $("bnN").textContent = b[1]; $("bnS").textContent = b[2];
  $("banner").classList.add("show"); if(b[3]) b[3]();
  setTimeout(function(){ $("banner").classList.remove("show"); setTimeout(nextBanner, 340); }, 1800);
}
function floatText(anchor, txt, cls){
  var r = anchor.getBoundingClientRect(), d = document.createElement("div");
  d.className = "floater" + (cls ? " " + cls : ""); d.textContent = txt;
  d.style.left = (r.left + r.width/2 + window.scrollX) + "px"; d.style.top = (r.top + window.scrollY - 4) + "px";

/* ═════════════════════════ REWARDS ═════════════════════════ */
var lastTap = null;
document.addEventListener("pointerdown", function(e){ lastTap = { x:e.clientX, y:e.clientY, t:Date.now() }; }, true);
function boost(kind, amt, fx){
  if(fx === "coin") return;                      /* the coin itself flies to the ship */
  var from = lastTap && Date.now() - lastTap.t < 1500 ? lastTap : null;
  lastTap = null;
  if(!from || reduce){ Bay.hit(kind, amt); return; }
  mote(from, kind, function(){ Bay.hit(kind, amt); });
}
function mote(from, kind, done){
  var to = Bay.shipPoint(), m = document.createElement("div");
  m.className = "mote" + (kind === "gold" ? " gold" : "");
  m.style.left = from.x + "px"; m.style.top = from.y + "px";
  document.body.appendChild(m);
  if(!m.animate){ m.parentNode.removeChild(m); done(); return; }
  var dx = to.x - from.x, dy = to.y - from.y, lift = Math.min(160, Math.abs(dy)*.35 + 40);
  m.animate([{ transform:"translate(-50%,-50%) scale(.6)", opacity:.4 },
             { transform:"translate(calc(-50% + " + dx*.4 + "px),calc(-50% + " + (dy*.4 - lift) + "px)) scale(1.25)", opacity:1, offset:.45 },
             { transform:"translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) scale(.7)", opacity:1 }],
    { duration:Math.min(820, 420 + Math.hypot(dx, dy)*.35), easing:"cubic-bezier(.45,0,.55,1)" }).onfinish = function(){ if(m.parentNode) m.parentNode.removeChild(m); done(); };
}
function award(id, xp, gold, label, fx){
  if(S.done[id]) return false;
  var before = rankIndex(S.xp);
  S.done[id] = true; S.xp += xp||0; S.gold += gold||0;
  if(label){
    var bits = []; if(xp) bits.push("<b>+" + xp + " XP</b>"); if(gold) bits.push("<b>+" + gold + "</b> " + t("gold"));
    toast(bits.join(" · ") + " — " + label, gold && !xp ? "gold" : "");
  }
  if(gold) sfxGold(); else if(xp) sfxXp();
  if(!S.sailing){ S.sailing = true; Bay.setLive(true); }
  boost(gold ? "gold" : "xp", gold || xp, fx);
  afterChange(before);
  return true;
}
function afterChange(beforeRank){
  var after = rankIndex(S.xp);
  if(after > beforeRank){ banner(t("lvUp"), L(RANKS[after].n), t("lvN", after+1) + " · " + t("fasterReload") + " · " + L(SHOT_NAMES)[after], sfxLevel); Bay.celebrate("level"); }
  var tt = tierIndex(S.gold);
  if(tt > S.tier){ S.tier = tt; banner(t("shipUp"), L(TIERS[tt].n), L(TIERS[tt].adds), sfxLevel); Bay.celebrate("tier"); }
  paintHud(); save(); checkAchievements(false); Bay.refresh();
}

function checkAchievements(silent){
  var got = {
    ach_start: has("start"),
    ach_quest: allDone(QUESTS.map(function(q){ return q.id; })),
    ach_study: allDone(ARTIFACTS.concat(GAMES).map(function(a){ return a.id; })),
    ach_loot: allDone(ITEMS.map(function(i){ return i.id; })),
    ach_coins: allDone(COINS.map(function(c){ return c.id; })),
    ach_map: allDone(LOCS.map(function(l){ return "loc_" + l.id; })),
    ach_gunner: S.sunk >= 10,
    ach_kraken: S.tents >= 10,
    ach_rapid: rankIndex(S.xp) === RANKS.length-1,
    ach_ship: S.tier === TIERS.length-1,
    ach_secret: allDone(["sec_moon","sec_years","sec_star"]),
    ach_chest: has("chest_open")
  };
  ACHS.forEach(function(a){

    if(node && got[a.id] && !node.classList.contains("on")){

}

var ACTIONS = null;
function progress(){
  if(!ACTIONS){
    ACTIONS = ["start"]
      .concat(Array.prototype.map.call(document.querySelectorAll("section[data-xp]"), function(s){ return "loc_" + s.id; }))
      .concat(QUESTS.map(function(q){ return q.id; })).concat(ARTIFACTS.concat(GAMES).map(function(a){ return a.id; }))
      .concat(ITEMS.map(function(i){ return i.id; })).concat(["sec_moon","sec_years","sec_star","chest_open"])
      .concat(COINS.map(function(c){ return c.id; })).concat(GLOWS.slice());
  }
  var n=0; for(var i=0;i<ACTIONS.length;i++){ if(S.done[ACTIONS[i]]) n++; } return n / ACTIONS.length;
}

/* ═════════════════════════ THE BAY ═════════════════════════
   One canvas, measured in bay units: the bay is 100u tall and 1u = U px.
   The ship holds the middle of the bay and fires on its own. Gold (ship

    for(k = 0; k < foes.length; k++) if(foes[k].type === "tent" && !foes[k].front) drawTent(foes[k]);
    for(k = 0; k < foes.length; k++) if(foes[k].type === "pirate") drawPir(foes[k]);
    drawShip();
    for(k = 0; k < foes.length; k++) if(foes[k].type === "tent" && foes[k].front) drawTent(foes[k]);
    front();
    drawBars();
    for(k = 0; k < balls.length; k++) drawBall(balls[k]);
    drawParts(); drawTexts();
  }
  function frame(ts){
    if(!last) last = ts;
    var dt = Math.min(.05, (ts - last) / 1000); last = ts; time += dt;
    if(cv.width > 1){ update(dt); draw(); }
    requestAnimationFrame(frame);
  }

  /* ── HUD readouts ── */
  function ui(){
    $("fpPct").textContent = FP.pct + "%";
    $("fpBar").style.width = FP.pct + "%";
    $("stD").textContent = live ? statusLine(FP) : t("calm");
  }
  function counts(){ $("cSunk").textContent = S.sunk; $("cTent").textContent = S.tents; }

  return {
    resize:resize,
    start:function(){ resize(); counts(); ui(); requestAnimationFrame(frame); },
    setLive:function(v){ if(v && !live) spawnIn = 1.4; live = !!v; ui(); },
    celebrate:celebrate, hit:hit, shipPoint:shipPoint,
    refresh:function(){ FP = firepower(); ui(); }
  };
})();

function layout(){
  Bay.resize();
  document.documentElement.style.setProperty("--hud-h", $("hud").offsetHeight + "px");
}

/* ═════════════════════════ HERO EXTRAS ═════════════════════════ */
(function(){
  var g = $("stars"); if(!g) return;
  var frag = document.createDocumentFragment();
  for(var i=0;i<74;i++){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", (Math.random()*1200).toFixed(1)); c.setAttribute("cy", (Math.random()*380).toFixed(1));
    c.setAttribute("r", (Math.random()*1.5 + .5).toFixed(2)); c.setAttribute("fill", "#DCE7FB"); c.setAttribute("opacity", (Math.random()*.55 + .2).toFixed(2));
    if(!reduce && i % 5 === 0){ c.style.animation = "twinkle " + (2.4 + Math.random()*3).toFixed(1) + "s ease-in-out infinite"; c.style.animationDelay = (Math.random()*3).toFixed(1) + "s"; }
    frag.appendChild(c);
  }
  g.appendChild(frag);
  var s = document.createElementNS("http://www.w3.org/2000/svg","circle");
  s.setAttribute("cx","636"); s.setAttribute("cy","74"); s.setAttribute("r","4.4"); s.setAttribute("fill","#FFE9C9"); s.setAttribute("opacity",".95");
  s.style.cursor = "pointer"; s.id = "secretStar"; s.setAttribute("role","button"); s.setAttribute("tabindex","0");
  g.appendChild(s);
})();
function wireSecret(node, id){
  if(!node) return;
  function take(){
    if(has(id)) return;
    if(node.classList) node.classList.add("found");
    if(node.tagName && node.tagName.toLowerCase() === "circle"){ node.setAttribute("fill","#E3A93C"); node.style.cursor = "default"; }
    award(id, 50, 150, t("secretFound") + t(id));
  }
  node.addEventListener("click", take);
  node.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); take(); } });
  if(has(id)){
    if(node.classList) node.classList.add("found");
    if(node.tagName && node.tagName.toLowerCase() === "circle"){ node.setAttribute("fill","#E3A93C"); node.style.cursor = "default"; }
  }
}
wireSecret($("secretMoon"), "sec_moon");
wireSecret($("secretStar"), "sec_star");

var btnStart = $("btnStart");
function paintStart(){ if(has("start")){ btnStart.textContent = t("started"); btnStart.disabled = true; } else btnStart.textContent = t("start"); }
btnStart.addEventListener("click", function(){
  award("start", 60, 100, t("journey")); paintStart();
  var el = $("journal"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
});
var btnChest = $("btnChest");
function paintChest(){
  if(has("chest_open")){ $("contacts").classList.add("open"); $("chestLid").style.transform = "rotate(-108deg)"; btnChest.disabled = true; btnChest.textContent = t("chestOpened"); }
  else btnChest.textContent = t("chestBtn");
}
btnChest.addEventListener("click", function(){ award("chest_open", 250, 300, t("chestOpen")); paintChest(); });

function watchSections(){
  if(!("IntersectionObserver" in window)) return;
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var s = e.target, id = "loc_" + s.id;
      if(!has(id)){ award(id, parseInt(s.dataset.xp,10) || 40, 0, t("locFound") + L(LOCNAME[s.id])); paintPins(); }
      obs.unobserve(s);
    });
  }, { rootMargin:"0px 0px -22% 0px", threshold:.12 });
  Array.prototype.forEach.call(document.querySelectorAll("section[data-xp]"), function(s){ if(!has("loc_" + s.id)) obs.observe(s); });
}

/* ═════════════════════════ LANGUAGE SWITCH ═════════════════════════ */
function renderAll(){
  renderStatic(); buildResume(); wireGlows(); placeCoins(); placeHint();
  wireSecret($("secretYears"), "sec_years");
  paintStart(); paintChest(); paintPins(); checkAchievements(true);
}
function setLang(l){
  if(l !== "en" && l !== "ru") return;
  S.lang = l; save();
  if(l === LANG) return;
  LANG = l; renderAll(); paintHud(); Bay.refresh(); layout();
}
Array.prototype.forEach.call(document.querySelectorAll("#langSwitch button"), function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
});

var btnSound = $("btnSound");
function setSfx(on){ S.sfx = on; btnSound.setAttribute("aria-pressed", on ? "true" : "false"); save(); }
btnSound.addEventListener("click", function(){ setSfx(!S.sfx); if(S.sfx) sfxXp(); });
$("btnReset").addEventListener("click", function(){
  try{ localStorage.setItem(KEY, JSON.stringify({ lang:LANG })); }catch(e){}
  location.reload();
});

/* ═════════════════════════ BOOT ═════════════════════════ */
function boot(saved){
  if(saved && typeof saved === "object" && saved.done) absorb(saved); else load();
  var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  LANG = S.lang || (/^(ru|be|uk|kk)/.test(nav) ? "ru" : "en");
  S.tier = Math.max(S.tier, tierIndex(S.gold));
  setSfx(S.sfx);
  renderAll();
  Bay.start(); layout(); paintHud(); checkAchievements(true); save();
  booted = true;
  Bay.setLive(!!S.sailing);
  setTimeout(watchSections, 900);
}
window.addEventListener("resize", layout);
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(function(){ return S; });
  if(window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data);
}else{ boot(null); }
})();
</script>
